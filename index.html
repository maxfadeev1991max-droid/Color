/* ============================================================================
   ROUND 1 — "ИИ-ХУДОЖНИК" (AI ARTIST)
   Single-file prototype. Two mock service boundaries are clearly marked:
     - generateImageMock()   → replace with a real text-to-image API call
     - compareImagesMock()   → replace with a real vision/similarity API call
   Both are called from a backend in production — never expose API keys here.
   ========================================================================== */

/* ---------------------------- deterministic PRNG --------------------------- */
// Lets the mock feel less like pure noise: same description → same "verdict".
function hashString(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  }
  return h;
}
function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------------------------- prompt understanding ---------------------------- */
// Very small keyword parser (RU + EN) so the mock genuinely reacts to what
// was typed, instead of producing pure random noise. A real API call would
// replace this whole file section — this just makes the mock legible.
const COLOR_WORDS = [
  { stems: ["красн", "red"], hex: "#EF4444" },
  { stems: ["оранж", "orange"], hex: "#F97316" },
  { stems: ["жёлт", "желт", "yellow"], hex: "#EAB308" },
  { stems: ["зелён", "зелен", "green"], hex: "#22C55E" },
  { stems: ["бирюз", "teal", "turquoise"], hex: "#14B8A6" },
  { stems: ["голуб", "cyan"], hex: "#38BDF8" },
  { stems: ["син", "blue"], hex: "#3B82F6" },
  { stems: ["фиолет", "purple", "violet"], hex: "#A855F7" },
  { stems: ["розов", "pink"], hex: "#EC4899" },
  { stems: ["коричнев", "brown"], hex: "#92400E" },
  { stems: ["чёрн", "черн", "black"], hex: "#1E293B" },
  { stems: ["бел", "white"], hex: "#F1F5F9" },
  { stems: ["сер", "gray", "grey"], hex: "#94A3B8" },
  { stems: ["золот", "gold"], hex: "#FBBF24" },
];

const OBJECT_ICONS = [
  { stems: ["кот", "кошк", "котён", "котен", "cat"], type: "cat", color: "#F97316" },
  { stems: ["собак", "пёс", "пес", "щен", "dog"], type: "dog", color: "#92400E" },
  { stems: ["дом", "house", "домик"], type: "house", color: "#EF4444" },
  { stems: ["дерев", "tree", "лес"], type: "tree", color: "#22C55E" },
  { stems: ["солнц", "sun"], type: "sun", color: "#FBBF24" },
  { stems: ["лун", "moon"], type: "moon", color: "#E2E8F0" },
  { stems: ["звезд", "звёзд", "star"], type: "star", color: "#FDE68A" },
  { stems: ["сердц", "heart", "любов"], type: "heart", color: "#EF4444" },
  { stems: ["облак", "туч", "cloud"], type: "cloud", color: "#CBD5E1" },
  { stems: ["гор", "mountain"], type: "mountain", color: "#64748B" },
  { stems: ["вод", "озер", "рек", "мор", "sea", "water", "lake"], type: "water", color: "#38BDF8" },
  { stems: ["дожд", "rain"], type: "rain", color: "#38BDF8" },
  { stems: ["птиц", "bird"], type: "bird", color: "#0EA5E9" },
  { stems: ["зонт", "umbrella"], type: "umbrella", color: "#EC4899" },
  { stems: ["окно", "window"], type: "window", color: "#E2E8F0" },
  { stems: ["цветок", "цветы", "flower"], type: "flower", color: "#EC4899" },
];

function detectColors(promptLower) {
  const found = [];
  COLOR_WORDS.forEach((c) => {
    if (c.stems.some((s) => promptLower.includes(s))) found.push(c.hex);
  });
  return found;
}
function detectObjects(promptLower) {
  const found = [];
  OBJECT_ICONS.forEach((o) => {
    if (o.stems.some((s) => promptLower.includes(s))) found.push(o);
  });
  return found.slice(0, 6);
}

function drawIcon(ctx, type, cx, cy, s, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(2, s * 0.04);
  switch (type) {
    case "sun":
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.32, 0, Math.PI * 2);
      ctx.fill();
      for (let a = 0; a < 8; a++) {
        const ang = (a / 8) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(ang) * s * 0.45, cy + Math.sin(ang) * s * 0.45);
        ctx.lineTo(cx + Math.cos(ang) * s * 0.68, cy + Math.sin(ang) * s * 0.68);
        ctx.stroke();
      }
      break;
    case "moon":
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.36, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(cx + s * 0.16, cy - s * 0.08, s * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      break;
    case "star": {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const ang = (Math.PI * 2 * i) / 5 - Math.PI / 2;
        const ang2 = ang + Math.PI / 5;
        const xo = cx + Math.cos(ang) * s * 0.45,
          yo = cy + Math.sin(ang) * s * 0.45;
        const xi = cx + Math.cos(ang2) * s * 0.18,
          yi = cy + Math.sin(ang2) * s * 0.18;
        if (i === 0) ctx.moveTo(xo, yo);
        else ctx.lineTo(xo, yo);
        ctx.lineTo(xi, yi);
      }
      ctx.closePath();
      ctx.fill();
      break;
    }
    case "heart":
      ctx.beginPath();
      ctx.moveTo(cx, cy + s * 0.28);
      ctx.bezierCurveTo(cx - s * 0.5, cy - s * 0.15, cx - s * 0.18, cy - s * 0.5, cx, cy - s * 0.12);
      ctx.bezierCurveTo(cx + s * 0.18, cy - s * 0.5, cx + s * 0.5, cy - s * 0.15, cx, cy + s * 0.28);
      ctx.fill();
      break;
    case "tree":
      ctx.fillStyle = "#78350F";
      ctx.fillRect(cx - s * 0.05, cy, s * 0.1, s * 0.35);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(cx, cy - s * 0.08, s * 0.32, 0, Math.PI * 2);
      ctx.fill();
      break;
    case "house":
      ctx.fillRect(cx - s * 0.28, cy - s * 0.02, s * 0.56, s * 0.35);
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.36, cy - s * 0.02);
      ctx.lineTo(cx, cy - s * 0.35);
      ctx.lineTo(cx + s * 0.36, cy - s * 0.02);
      ctx.closePath();
      ctx.fill();
      break;
    case "cat":
      ctx.beginPath();
      ctx.ellipse(cx, cy, s * 0.3, s * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx - s * 0.22, cy - s * 0.26, s * 0.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.34, cy - s * 0.35);
      ctx.lineTo(cx - s * 0.26, cy - s * 0.5);
      ctx.lineTo(cx - s * 0.16, cy - s * 0.36);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.12, cy - s * 0.37);
      ctx.lineTo(cx - s * 0.04, cy - s * 0.5);
      ctx.lineTo(cx + s * 0.04, cy - s * 0.37);
      ctx.fill();
      break;
    case "dog":
      ctx.beginPath();
      ctx.ellipse(cx, cy, s * 0.3, s * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx - s * 0.26, cy - s * 0.2, s * 0.14, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx - s * 0.4, cy - s * 0.14, s * 0.06, s * 0.12, 0.4, 0, Math.PI * 2);
      ctx.fill();
      break;
    case "cloud":
      [
        [-0.18, 0, 0.2],
        [0.1, -0.08, 0.24],
        [0.33, 0, 0.18],
      ].forEach(([dx, dy, r]) => {
        ctx.beginPath();
        ctx.arc(cx + s * dx, cy + s * dy, s * r, 0, Math.PI * 2);
        ctx.fill();
      });
      break;
    case "mountain":
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.42, cy + s * 0.22);
      ctx.lineTo(cx - s * 0.08, cy - s * 0.28);
      ctx.lineTo(cx + s * 0.14, cy + s * 0.02);
      ctx.lineTo(cx + s * 0.42, cy + s * 0.22);
      ctx.closePath();
      ctx.fill();
      break;
    case "water":
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(cx - s * 0.36, cy + i * s * 0.1);
        ctx.quadraticCurveTo(cx - s * 0.18, cy + i * s * 0.1 - s * 0.05, cx, cy + i * s * 0.1);
        ctx.quadraticCurveTo(cx + s * 0.18, cy + i * s * 0.1 + s * 0.05, cx + s * 0.36, cy + i * s * 0.1);
        ctx.lineWidth = s * 0.03;
        ctx.stroke();
      }
      break;
    case "rain":
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(cx - s * 0.3 + i * s * 0.14, cy - s * 0.18);
        ctx.lineTo(cx - s * 0.35 + i * s * 0.14, cy + s * 0.18);
        ctx.lineWidth = s * 0.03;
        ctx.stroke();
      }
      break;
    case "bird":
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.28, cy);
      ctx.quadraticCurveTo(cx - s * 0.1, cy - s * 0.18, cx, cy);
      ctx.quadraticCurveTo(cx + s * 0.1, cy - s * 0.18, cx + s * 0.28, cy);
      ctx.lineWidth = s * 0.04;
      ctx.stroke();
      break;
    case "umbrella":
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.32, Math.PI, 0);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx, cy + s * 0.35);
      ctx.lineWidth = s * 0.03;
      ctx.stroke();
      break;
    case "window":
      ctx.strokeRect(cx - s * 0.22, cy - s * 0.22, s * 0.44, s * 0.44);
      ctx.beginPath();
      ctx.moveTo(cx, cy - s * 0.22);
      ctx.lineTo(cx, cy + s * 0.22);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.22, cy);
      ctx.lineTo(cx + s * 0.22, cy);
      ctx.stroke();
      break;
    case "flower":
      for (let a = 0; a < 5; a++) {
        const ang = (a / 5) * Math.PI * 2;
        ctx.beginPath();
        ctx.ellipse(
          cx + Math.cos(ang) * s * 0.16,
          cy + Math.sin(ang) * s * 0.16,
          s * 0.14,
          s * 0.09,
          ang,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }
      ctx.fillStyle = "#FBBF24";
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.1, 0, Math.PI * 2);
      ctx.fill();
      break;
    default:
      break;
  }
  ctx.restore();
}

/* =============================================================================
   MOCK SERVICE #1 — image generation
   Real integration: POST { prompt } to your backend → backend calls an
   image-generation API (key stored server-side only) → returns an image URL.
   Signature to preserve: generateImage(prompt, onStage) => Promise<string>
   ============================================================================= */
function generateImageMock(prompt, onStage) {
  return new Promise((resolve, reject) => {
    const seed = hashString(prompt);
    const rand = mulberry32(seed);
    const promptLower = prompt.toLowerCase();

    const stages = [
      { label: "ИИ ЧИТАЕТ ОПИСАНИЕ…", delay: 900 },
      { label: "ИИ РИСУЕТ…", delay: 1400 },
      { label: "ПОЧТИ ГОТОВО…", delay: 800 },
    ];
    let elapsed = 0;
    stages.forEach((s) => {
      elapsed += s.delay;
      setTimeout(() => onStage && onStage(s.label), elapsed);
    });

    setTimeout(() => {
      // Small simulated failure rate so error states are reachable/testable.
      if (rand() < 0.06) {
        reject(new Error("generation_failed"));
        return;
      }

      const detectedColors = detectColors(promptLower);
      const detectedObjects = detectObjects(promptLower);

      const fallbackPalettes = [
        ["#0EA5E9", "#22D3EE", "#0F172A"],
        ["#D946EF", "#F472B6", "#1E1B4B"],
        ["#F59E0B", "#F97316", "#1C1917"],
        ["#22C55E", "#84CC16", "#052E16"],
        ["#6366F1", "#A855F7", "#170B2E"],
      ];
      // Prompt actually drives the palette when colors were named in it.
      const palette =
        detectedColors.length > 0
          ? [detectedColors[0], detectedColors[detectedColors.length - 1], "#0F172A"]
          : fallbackPalettes[Math.floor(rand() * fallbackPalettes.length)];

      const canvas = document.createElement("canvas");
      canvas.width = 640;
      canvas.height = 640;
      const ctx = canvas.getContext("2d");

      const grad = ctx.createLinearGradient(0, 0, 640, 640);
      grad.addColorStop(0, palette[2]);
      grad.addColorStop(1, palette[1] + "33");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 640, 640);

      const shapeCount = 4 + Math.floor(rand() * 4);
      for (let i = 0; i < shapeCount; i++) {
        const x = rand() * 640;
        const y = rand() * 640;
        const r = 40 + rand() * 140;
        const c = ctx.createRadialGradient(x, y, 0, x, y, r);
        const color = palette[Math.floor(rand() * palette.length)];
        c.addColorStop(0, color + "77");
        c.addColorStop(1, color + "00");
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Faint grid — reads as "synthetic / AI draft" texture.
      ctx.strokeStyle = "rgba(255,255,255,0.05)";
      ctx.lineWidth = 1;
      for (let gx = 0; gx < 640; gx += 40) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, 640);
        ctx.stroke();
      }
      for (let gy = 0; gy < 640; gy += 40) {
        ctx.beginPath();
        ctx.moveTo(0, gy);
        ctx.lineTo(640, gy);
        ctx.stroke();
      }

      // Draw a simple flat icon for every object actually named in the prompt,
      // laid out on a seeded grid so repeated prompts repeat their layout.
      const slots = [
        [160, 220],
        [480, 200],
        [320, 340],
        [160, 460],
        [480, 460],
        [320, 150],
      ];
      detectedObjects.forEach((obj, i) => {
        const [sx, sy] = slots[i % slots.length];
        const jitterX = (rand() - 0.5) * 40;
        const jitterY = (rand() - 0.5) * 40;
        const size = 130 + rand() * 60;
        const color = detectedColors[i % Math.max(1, detectedColors.length)] || obj.color;
        drawIcon(ctx, obj.type, sx + jitterX, sy + jitterY, size, color);
      });

      ctx.fillStyle = "rgba(255,255,255,0.4)";
      ctx.font = "600 13px monospace";
      const tagLine =
        detectedObjects.length > 0
          ? `РАСПОЗНАНО: ${detectedObjects.map((o) => o.type).join(", ")}`
          : "AI DRAFT · MOCK";
      ctx.fillText(tagLine, 20, 615);

      resolve(canvas.toDataURL("image/png"));
    }, elapsed + 400);
  });
}

/* =============================================================================
   MOCK SERVICE #2 — similarity comparison
   Real integration: send both images to a backend → backend runs a vision /
   embedding-similarity model → returns the same shape below.
   Signature to preserve: compareImages(prompt) => Promise<ComparisonResult>
   ============================================================================= */
function compareImagesMock(prompt) {
  return new Promise((resolve, reject) => {
    setTimeout(() => {
      const rand = mulberry32(hashString(prompt) + 7);
      if (rand() < 0.05) {
        reject(new Error("comparison_failed"));
        return;
      }

      const words = prompt.trim().split(/\s+/).filter(Boolean);
      const uniqueWords = new Set(words.map((w) => w.toLowerCase())).size;
      const lengthScore = Math.min(28, (prompt.length / 1000) * 28);
      const detailScore = Math.min(24, uniqueWords * 1.1);
      const jitter = rand() * 18 - 9;

      let similarity = Math.round(38 + lengthScore + detailScore + jitter);
      similarity = Math.max(6, Math.min(98, similarity));

      const sub = (base, spread) =>
        Math.max(4, Math.min(99, Math.round(base + (rand() * spread * 2 - spread))));

      const objects = sub(similarity + 5, 8);
      const composition = sub(similarity - 3, 9);
      const colors = sub(similarity + 1, 8);
      const details = sub(similarity - 7, 10);

      let comment;
      if (similarity <= 30) {
        comment =
          "ИИ почти не узнал оригинал. Попробуй описать больше деталей: объекты, цвета, их расположение.";
      } else if (similarity <= 60) {
        comment = "Неплохо! ИИ уловил общую идею, но часть деталей потерялась по дороге.";
      } else if (similarity <= 80) {
        comment = "Очень близко! ИИ поймал большинство важных элементов картинки.";
      } else if (similarity <= 95) {
        comment = "Отличная работа! Описание почти идеально передало то, что на изображении.";
      } else {
        comment = "ПОЧТИ ИДЕАЛЬНО! Такое чувство, что ИИ сам смотрел на оригинал.";
      }

      resolve({ similarity, objects, composition, colors, details, comment });
    }, 1700);
  });
}

/* =============================================================================
   REAL API VERSION (not wired up by default — see server-generate-image.js)
   To go live:
     1. Run the backend proxy (server-generate-image.js) with your OpenAI key.
     2. Replace the call in handleGenerate() below: swap
          generateImageMock(description, onStage)
        for
          generateImageReal(description, onStage)
   ============================================================================= */
async function generateImageReal(prompt, onStage) {
  onStage && onStage("ИИ ЧИТАЕТ ОПИСАНИЕ…");
  const res = await fetch("http://localhost:3001/api/generate-image", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt }),
  });
  onStage && onStage("ИИ РИСУЕТ…");
  if (!res.ok) throw new Error("generation_failed");
  const data = await res.json();
  onStage && onStage("ПОЧТИ ГОТОВО…");
  return data.imageUrl;
}

  if (v <= 80) return "text-cyan-400";
  if (v <= 95) return "text-fuchsia-400";

function ScoreBar({ label, value, color, delay }) {
  const [width, setWidth] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setWidth(value), delay);
    return () => clearTimeout(t);
  }, [value, delay]);
  return (
    <div className="flex items-center gap-3">
      <span className="text-xs text-slate-400 w-28 shrink-0">{label}</span>
      <div className="flex-1 h-2 rounded-full bg-slate-800 overflow-hidden">

          className={`h-full rounded-full ${color} transition-all duration-1000 ease-out`}
          style={{ width: `${width}%` }}
        />
      </div>
      <span className="text-xs font-semibold text-slate-300 w-9 text-right">{value}%</span>
    </div>
  );
}

function CountUpNumber({ target, className }) {
  const [n, setN] = useState(0);
  useEffect(() => {
    let raf;
    const start = performance.now();
    const duration = 1200;
    const tick = (now) => {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setN(Math.round(eased * target));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return <span className={className}>{n}%</span>;
}

/* =============================================================================
   MAIN COMPONENT
   ============================================================================= */
function RoundOne() {
  // gameState: idle | playing | generating | generated | checking | result | finished
  const [gameState, setGameState] = useState("idle");
  const [isHostMode, setIsHostMode] = useState(false);
  const [resultVisible, setResultVisible] = useState(true);

  const [originalImage, setOriginalImage] = useState(null);
  const [description, setDescription] = useState("");
  const [generatedImage, setGeneratedImage] = useState(null);
  const [stageLabel, setStageLabel] = useState("");
  const [comparison, setComparison] = useState(null);

  const [error, setError] = useState(null);
  const [isListening, setIsListening] = useState(false);
  const [voiceUnsupported, setVoiceUnsupported] = useState(false);

  const fileInputRef = useRef(null);
  const recognitionRef = useRef(null);

  const MAX_LEN = 1000;

  /* ----------------------------- image upload ----------------------------- */
  const handleFileSelect = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
      setError("Поддерживаются только форматы JPG, PNG и WEBP.");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      setOriginalImage(reader.result);
      setError(null);
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  };

  const removeOriginal = () => {
    setOriginalImage(null);
    if (gameState !== "idle") resetRound();
  };

  /* ------------------------------ voice input ------------------------------ */
  const toggleVoiceInput = () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      setVoiceUnsupported(true);
      return;
    }
    if (isListening) {
      recognitionRef.current?.stop();
      return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = "ru-RU";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      setIsListening(true);
      setVoiceUnsupported(false);
    };
    recognition.onerror = (event) => {
      setIsListening(false);
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        setError(
          "Доступ к микрофону заблокирован (браузером или окружением превью). Разрешите доступ к микрофону в настройках сайта или введите описание текстом."
        );
      } else if (event.error === "no-speech") {
        setError("Речь не распознана. Попробуйте ещё раз, говоря чётче и ближе к микрофону.");
      } else {
        setError("Не удалось распознать речь. Попробуйте ещё раз или введите текст вручную.");
      }
    };
    recognition.onend = () => setIsListening(false);
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      setDescription((prev) => {
        const combined = prev ? `${prev} ${transcript}` : transcript;
        return combined.slice(0, MAX_LEN);
      });
    };

    recognitionRef.current = recognition;
    recognition.start();
  };

  /* ------------------------------ generation ------------------------------ */
  const handleGenerate = async () => {
    if (!description.trim()) {
      setError("Сначала опиши, что изображено на картинке.");
      return;
    }
    setError(null);
    setGameState("generating");
    setStageLabel("ИИ ЧИТАЕТ ОПИСАНИЕ…");
    try {
      const url = await generateImageMock(description, (label) => setStageLabel(label));
      setGeneratedImage(url);
      setStageLabel("");
      setGameState("generated");
    } catch (e) {
      setStageLabel("");
      setGameState("playing");
      setError("Не удалось создать изображение. Попробуйте ещё раз.");
    }
  };

  /* ------------------------------ comparison ------------------------------ */
  const handleCheckSimilarity = async () => {
    setError(null);
    setGameState("checking");
    try {
      const result = await compareImagesMock(description);
      setComparison(result);
      setResultVisible(true);
      setGameState("result");
    } catch (e) {
      setGameState("generated");
      setError("Не удалось проверить схожесть. Попробуйте ещё раз.");
    }
  };

  /* --------------------------------- flow --------------------------------- */
  const startRound = () => {
    if (!originalImage) {
      setError("Ведущий должен загрузить оригинальное изображение перед стартом.");
      return;
    }
    setError(null);
    setGameState("playing");
  };

  const retryAttempt = () => {
    setGeneratedImage(null);
    setDescription("");
    setComparison(null);
    setError(null);
    setGameState("playing");
  };

  const resetRound = () => {
    setGeneratedImage(null);
    setDescription("");
    setComparison(null);
    setError(null);
    setStageLabel("");
    setGameState("idle");
  };

  const finishRound = () => setGameState("finished");

  const charCount = description.length;
  const isGenerating = gameState === "generating";
  const isChecking = gameState === "checking";
  const hasResult = gameState === "result" && comparison;

  /* ================================ RENDER ================================ */
  return (
    <div className="min-h-screen w-full bg-slate-950 text-slate-100 relative overflow-hidden">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .font-body { font-family: 'Inter', sans-serif; }
      `}</style>

      {/* ambient glow */}
      <div
        className="pointer-events-none absolute -top-32 -left-32 w-96 h-96 rounded-full blur-3xl opacity-20"
        style={{ background: "radial-gradient(circle, #22D3EE, transparent 70%)" }}
      />
      <div
        className="pointer-events-none absolute -bottom-32 -right-32 w-96 h-96 rounded-full blur-3xl opacity-20"
        style={{ background: "radial-gradient(circle, #E879F9, transparent 70%)" }}
      />

      {/* top bar */}
      <div className="relative z-30 flex items-center justify-between px-5 sm:px-8 py-4">
        <div className="font-display text-sm text-slate-500 tracking-wide">
          БИТВА С ИСКУССТВЕННЫМ ИНТЕЛЛЕКТОМ
        </div>
        <button
          onClick={() => setIsHostMode((v) => !v)}
          className={`flex items-center gap-2 px-3 py-2 rounded-xl border text-xs font-medium font-body transition-colors ${
            isHostMode
              ? "bg-cyan-500/10 border-cyan-400/40 text-cyan-300"
              : "bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200"
          }`}
        >
          <Settings className="w-4 h-4" />
          Режим ведущего
        </button>
      </div>

      {/* host panel */}
      {isHostMode && (
        <div className="relative z-30 mx-5 sm:mx-8 mb-4 rounded-2xl border border-cyan-400/20 bg-slate-900/70 backdrop-blur p-4 font-body">
          <p className="text-xs font-semibold text-cyan-300 mb-3 font-display tracking-wide">
            ПАНЕЛЬ ВЕДУЩЕГО
          </p>
          <div className="flex flex-wrap items-center gap-2">
            <button
              onClick={() => fileInputRef.current?.click()}
              className="flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm text-slate-200 transition-colors"
            >
              <Upload className="w-4 h-4" />
              {originalImage ? "Заменить оригинал" : "Загрузить оригинал"}
            </button>
            {originalImage && (
              <button
                onClick={removeOriginal}
                className="flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-800 hover:bg-rose-500/20 text-sm text-slate-300 hover:text-rose-300 transition-colors"
              >
                <Trash2 className="w-4 h-4" />
                Удалить
              </button>
            )}
            {gameState === "idle" && (
              <button
                onClick={startRound}
                className="flex items-center gap-2 px-3 py-2 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 text-sm text-cyan-300 transition-colors"
              >
                <Play className="w-4 h-4" />
                Начать раунд
              </button>
            )}
            {gameState === "result" && (
              <button
                onClick={() => setResultVisible((v) => !v)}
                className="flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm text-slate-200 transition-colors"
              >
                {resultVisible ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
                {resultVisible ? "Скрыть результат" : "Показать результат"}
              </button>
            )}
            {gameState !== "idle" && (
              <button
                onClick={resetRound}
                className="flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-800 hover:bg-rose-500/20 text-sm text-slate-300 hover:text-rose-300 transition-colors"
              >
                <RotateCcw className="w-4 h-4" />
                Сбросить раунд
              </button>
            )}
          </div>
          <input
            ref={fileInputRef}
            type="file"
            accept="image/jpeg,image/png,image/webp"
            className="hidden"
            onChange={handleFileSelect}
          />
        </div>
      )}

      {/* error banner */}
      {error && (
        <div className="relative z-30 mx-5 sm:mx-8 mb-4 flex items-start gap-2 rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-sm text-rose-300 font-body">
          <AlertTriangle className="w-4 h-4 mt-0.5 shrink-0" />
          <span>{error}</span>
        </div>
      )}

      {/* ============================ IDLE SCREEN ============================ */}
      {gameState === "idle" && (
        <div className="relative z-10 flex flex-col items-center justify-center px-6 py-16 text-center max-w-2xl mx-auto">
          <span className="font-display text-xs tracking-[0.2em] text-fuchsia-400 mb-3">РАУНД 1</span>
          <h1 className="font-display text-4xl sm:text-5xl font-bold mb-4 bg-gradient-to-r from-cyan-300 to-fuchsia-400 bg-clip-text text-transparent">
            ИИ-ХУДОЖНИК
          </h1>
          <p className="font-body text-slate-400 text-base sm:text-lg mb-10 max-w-lg">
            Сможешь объяснить ИИ, что изображено на картинке, чтобы он создал максимально похожую версию?
          </p>

          <div className="rounded-2xl border border-slate-800 bg-slate-900/60 p-6 mb-8 text-left font-body text-sm text-slate-300 leading-relaxed max-w-md">
            Перед тобой оригинальное изображение. Внимательно изучи его и опиши всё, что видишь.
            Твоя задача — дать ИИ такое описание, чтобы он смог создать максимально похожую картинку.
          </div>

          {!originalImage && (
            <p className="text-xs text-slate-500 mb-4 font-body">
              Ведущий ещё не загрузил оригинальное изображение.
            </p>
          )}

          <button
            onClick={startRound}
            disabled={!originalImage}
            className={`font-display px-10 py-4 rounded-2xl text-lg font-semibold tracking-wide transition-all ${
              originalImage
                ? "bg-gradient-to-r from-cyan-400 to-fuchsia-500 text-slate-950 hover:brightness-110 shadow-lg shadow-fuchsia-500/20"
                : "bg-slate-800 text-slate-500 cursor-not-allowed"
            }`}
          >
            НАЧАТЬ
          </button>
        </div>
      )}

      {/* ============================ GAME SCREEN ============================ */}
      {gameState !== "idle" && gameState !== "finished" && (
        <div className="relative z-10 px-5 sm:px-8 pb-16 max-w-6xl mx-auto font-body">
          {/* progress */}
          <div className="flex items-center gap-3 mb-6">
            <span className="font-display text-xs tracking-wide text-slate-400">РАУНД 1 ИЗ 3</span>
            <div className="flex-1 flex gap-1.5">
              <div className="h-1.5 flex-1 rounded-full bg-gradient-to-r from-cyan-400 to-fuchsia-500" />
              <div className="h-1.5 flex-1 rounded-full bg-slate-800" />
              <div className="h-1.5 flex-1 rounded-full bg-slate-800" />
            </div>
          </div>

          {/* image panels */}
          <div className="flex flex-col sm:flex-row gap-4 mb-8 relative items-stretch">
            <ImagePanel
              label="ОРИГИНАЛ"
              accent={{
                border: "border-cyan-400/20",
                bg: "bg-slate-900/40",
                text: "text-cyan-300",
                iconBg: "bg-cyan-400/10",
              }}
              image={originalImage}
              emptyIcon={<ScanEye className="w-7 h-7 text-cyan-400" />}
              emptyText="Оригинал ещё не загружен"
            />

            <div className="hidden sm:flex items-center justify-center">
              <div className="w-10 h-10 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center font-display text-xs text-slate-400 shrink-0">
                VS
              </div>
            </div>

            <ImagePanel
              label="ИЗОБРАЖЕНИЕ ИИ"
              accent={{
                border: "border-fuchsia-400/20",
                bg: "bg-slate-900/40",
                text: "text-fuchsia-300",
                iconBg: "bg-fuchsia-400/10",
              }}
              image={generatedImage}
              emptyIcon={<Wand2 className="w-7 h-7 text-fuchsia-400" />}
              emptyText="Здесь появится изображение, созданное искусственным интеллектом"
              stageLabel={isGenerating ? stageLabel : ""}
            />
          </div>

          {/* description block — hidden once we're checking/showing result to keep focus */}
          {(gameState === "playing" || gameState === "generating" || gameState === "generated") && (
            <div className="rounded-3xl border border-slate-800 bg-slate-900/50 p-5 sm:p-6 mb-6">
              <h2 className="font-display text-sm tracking-wide text-slate-300 mb-3">ОПИШИ, ЧТО ТЫ ВИДИШЬ</h2>

              <div className="flex flex-col sm:flex-row gap-3">
                <textarea
                  value={description}
                  onChange={(e) => setDescription(e.target.value.slice(0, MAX_LEN))}

                  placeholder="Например: на картинке изображён маленький рыжий кот, который сидит на подоконнике. За окном идёт дождь, на заднем плане видны высокие дома…"
                  rows={5}
                  className="flex-1 resize-none rounded-2xl bg-slate-950/60 border border-slate-800 focus:border-cyan-400/50 outline-none px-4 py-3 text-sm text-slate-100 placeholder:text-slate-600 transition-colors"
                />
                <button
                  onClick={toggleVoiceInput}
                  disabled={isGenerating}
                  className={`shrink-0 flex sm:flex-col items-center justify-center gap-2 px-5 py-4 rounded-2xl font-display text-xs font-semibold tracking-wide transition-colors ${
                    isListening
                      ? "bg-rose-500/20 text-rose-300 border border-rose-400/40 animate-pulse"
                      : "bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700"
                  }`}
                >
                  <Mic className="w-5 h-5" />
                  {isListening ? "СЛУШАЮ…" : "ДИКТОВАТЬ"}
                </button>
              </div>

              {voiceUnsupported && (
                <p className="text-xs text-amber-400 mt-2">
                  Голосовой ввод недоступен в этом браузере. Введите описание вручную.
                </p>
              )}

              <div className="flex items-center justify-between mt-2">
                <span className="text-xs text-slate-600">{charCount} / {MAX_LEN}</span>
              </div>

              <button
                onClick={handleGenerate}
                disabled={!description.trim() || isGenerating}
                className={`mt-4 w-full font-display py-4 rounded-2xl text-base font-semibold tracking-wide transition-all flex items-center justify-center gap-2 ${
                  !description.trim() || isGenerating
                    ? "bg-slate-800 text-slate-500 cursor-not-allowed"
                    : "bg-gradient-to-r from-cyan-400 to-fuchsia-500 text-slate-950 hover:brightness-110 shadow-lg shadow-fuchsia-500/20"

              >
                {isGenerating ? (
                  <>
                    <RefreshCw className="w-5 h-5 animate-spin" />
                    ИИ СОЗДАЁТ ИЗОБРАЖЕНИЕ…
                  </>
                ) : (
                  <>
                    <Sparkles className="w-5 h-5" />
                    СГЕНЕРИРОВАТЬ ИЗОБРАЖЕНИЕ
                  </>
                )}
              </button>
            </div>
          )}

          {/* check similarity button */}
          {gameState === "generated" && (
            <button
              onClick={handleCheckSimilarity}
              className="w-full font-display py-4 rounded-2xl text-base font-semibold tracking-wide bg-slate-100 text-slate-950 hover:bg-white transition-colors flex items-center justify-center gap-2"
            >
              <ScanEye className="w-5 h-5" />
              ПРОВЕРИТЬ СХОЖЕСТЬ
            </button>
          )}

          {isChecking && (
            <div className="w-full rounded-2xl border border-slate-800 bg-slate-900/50 py-6 flex flex-col items-center gap-3">
              <div className="relative w-10 h-10">
                <div className="absolute inset-0 rounded-full border-2 border-slate-700" />
                <div className="absolute inset-0 rounded-full border-2 border-t-cyan-400 border-r-fuchsia-400 border-b-transparent border-l-transparent animate-spin" />
              </div>
              <p className="text-sm text-slate-300 tracking-wide animate-pulse font-display">
                ИИ СРАВНИВАЕТ ИЗОБРАЖЕНИЯ…
              </p>
            </div>
          )}

          {/* result */}
          {hasResult && resultVisible && (
            <div className="rounded-3xl border border-slate-800 bg-gradient-to-b from-slate-900/80 to-slate-900/40 p-6 sm:p-10 text-center">
              <p className="font-display text-xs tracking-[0.2em] text-slate-500 mb-2">РЕЗУЛЬТАТ</p>
              <CountUpNumber
                target={comparison.similarity}
                className={`font-display block text-7xl sm:text-8xl font-bold mb-2 ${verdictColor(
                  comparison.similarity
                )}`}
              />
              <p className="font-display text-sm tracking-wide text-slate-400 mb-6">СХОЖЕСТЬ</p>

              <p className="font-body text-slate-300 max-w-md mx-auto mb-8">{comparison.comment}</p>

              <div className="max-w-sm mx-auto flex flex-col gap-3 mb-8 text-left">
                <ScoreBar label="ОБЪЕКТЫ" value={comparison.objects} color="bg-cyan-400" delay={200} />
                <ScoreBar label="КОМПОЗИЦИЯ" value={comparison.composition} color="bg-fuchsia-400" delay={350} />
                <ScoreBar label="ЦВЕТА" value={comparison.colors} color="bg-amber-400" delay={500} />
                <ScoreBar label="ДЕТАЛИ" value={comparison.details} color="bg-emerald-400" delay={650} />
              </div>

              <div className="flex flex-col sm:flex-row gap-3 justify-center">
                <button
                  onClick={retryAttempt}
                  className="font-display px-6 py-3 rounded-2xl text-sm font-semibold tracking-wide bg-gradient-to-r from-cyan-400 to-fuchsia-500 text-slate-950 hover:brightness-110 flex items-center justify-center gap-2"
                >
                  <RefreshCw className="w-4 h-4" />
                  ПОПРОБОВАТЬ ЕЩЁ РАЗ
                </button>
                <button
                  onClick={finishRound}
                  className="font-display px-6 py-3 rounded-2xl text-sm font-semibold tracking-wide bg-slate-800 text-slate-200 hover:bg-slate-700"
                >
                  ЗАВЕРШИТЬ РАУНД
                </button>
              </div>
            </div>
          )}

          {hasResult && !resultVisible && (
            <div className="rounded-3xl border border-slate-800 bg-slate-900/50 p-10 text-center">
              <p className="font-body text-sm text-slate-500">
                Результат скрыт ведущим. Нажмите «Показать результат» в панели ведущего, чтобы раскрыть его.
              </p>
            </div>
          )}
        </div>
      )}

      {/* ============================ FINISHED ============================ */}
      {gameState === "finished" && (
        <div className="relative z-10 flex flex-col items-center justify-center px-6 py-24 text-center">
          <p className="font-display text-xs tracking-[0.2em] text-slate-500 mb-3">РАУНД 1 ЗАВЕРШЁН</p>
          <h2 className="font-display text-3xl font-bold mb-6 bg-gradient-to-r from-cyan-300 to-fuchsia-400 bg-clip-text text-transparent">
            ИИ-ХУДОЖНИК
          </h2>
          {comparison && (
            <p className="font-body text-slate-400 mb-8">
              Финальный результат:{" "}
              <span className={`font-semibold ${verdictColor(comparison.similarity)}`}>
                {comparison.similarity}%
              </span>
            </p>
          )}
          <button
            onClick={resetRound}
            className="font-display px-8 py-4 rounded-2xl text-sm font-semibold tracking-wide bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center gap-2"
          >
            <RotateCcw className="w-4 h-4" />
            НАЧАТЬ ЗАНОВО
          </button>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<RoundOne />);
</script>
</body>
</html>
